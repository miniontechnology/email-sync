services:
  stalwart:
    image: stalwartlabs/stalwart:latest
    restart: unless-stopped
    environment:
      STALWART_RECOVERY_ADMIN: admin:adminpass
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:18443:443"
      - "127.0.0.1:10143:143"
      - "127.0.0.1:10993:993"
    volumes:
      - ./stalwart:/etc/stalwart
      - stalwart-data:/var/lib/stalwart

  greenmail:
    image: greenmail/standalone:2.1.2
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.hostname=0.0.0.0 -Dgreenmail.setup.test.imap -Dgreenmail.setup.test.imaps -Dgreenmail.users=alice:sourcepass"
    ports:
      - "127.0.0.1:3143:3143"
      - "127.0.0.1:3993:3993"
      - "127.0.0.1:3025:3025"

  radicale:
    image: tomsquest/docker-radicale:latest
    restart: unless-stopped
    environment:
      RADICALE_CONFIG_SERVER_HOSTS: "0.0.0.0:5232"
      RADICALE_CONFIG_AUTH_TYPE: htpasswd
      RADICALE_CONFIG_AUTH_HTPASSWD_FILENAME: /etc/radicale-users
      RADICALE_CONFIG_AUTH_HTPASSWD_ENCRYPTION: plain
      RADICALE_CONFIG_RIGHTS_TYPE: owner_only
      RADICALE_CONFIG_STORAGE_FILESYSTEM_FOLDER: /data/collections
    ports:
      - "127.0.0.1:15232:5232"
    volumes:
      - ./radicale-users:/etc/radicale-users:ro
      - radicale-data:/data/collections

volumes:
  stalwart-data:
  radicale-data:
