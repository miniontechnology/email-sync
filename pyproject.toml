[project]
name = "email-sync"
version = "0.1.0"
description = "Self-hosted migration and sync of mail, contacts and calendars (IMAP, JMAP, CalDAV, CardDAV)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9",
    "imapclient>=3.0,<4",
    "httpx>=0.27,<1",
    "cryptography>=42",
    "icalendar>=5.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["emailsync*"]

[tool.setuptools.package-data]
emailsync = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
markers = ["integration: requires the docker-compose test servers (see tests/integration/README.md)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
